x-otel: &otel
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_METRIC_EXPORT_INTERVAL: "10000"

services:

  persistenceapi:
    build:
      context: .
      dockerfile: PersistenceApi/Dockerfile

    container_name: suez-persistence-api

    ports:
      - "5125:8080"

    environment:
      <<: *otel
      RabbitMq__HostName: rabbitmq
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=suezdb;Username=suez;Password=suezpassword

      # Adresse interne Docker de CacheApi.
      CacheApi__BaseUrl: http://cacheapi:8080

    depends_on:
      rabbitmq:
        condition: service_healthy

      postgres:
        condition: service_healthy

      cacheapi:
        condition: service_started

      otel-collector:
        condition: service_started


  cacheapi:
    build:
      context: .
      dockerfile: CacheApi/Dockerfile

    container_name: suez-cache-api

    ports:
      - "5126:8080"

    environment:
      <<: *otel
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Redis: redis:6379

    depends_on:
      redis:
        condition: service_healthy

      otel-collector:
        condition: service_started


  producer:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Producer/Dockerfile

    container_name: suez-producer

    environment:
      <<: *otel
      RabbitMq__HostName: rabbitmq

    depends_on:
      rabbitmq:
        condition: service_healthy

      otel-collector:
        condition: service_started


  rabbitmq:
    image: rabbitmq:4-management

    # Garde le même nom de noeud pour retrouver les données après un down/up.
    hostname: rabbitmq

    container_name: suez-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      # Attend le broker et ses ports avant de démarrer le consumer.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 20


  postgres:
    image: postgres:17

    container_name: suez-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_DB: suezdb
      POSTGRES_USER: suez
      POSTGRES_PASSWORD: suezpassword

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suez -d suezdb"]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:8

    container_name: suez-redis

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20


  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0

    container_name: suez-otel-collector

    command:
      - "--config=/etc/otel-collector.yaml"

    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro

    depends_on:
      - lgtm


  lgtm:
    image: grafana/otel-lgtm:0.35.0

    container_name: suez-lgtm

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning/dashboards/suez.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/suez.yaml:ro


volumes:
  rabbitmq-data:
  postgres-data:
  redis-data:
