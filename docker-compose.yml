services:

  rabbitmq:
    image: rabbitmq:4-management
    container_name: suez-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  postgres:
    image: postgres:17
    container_name: suez-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: suezdb
      POSTGRES_USER: suez
      POSTGRES_PASSWORD: suezpassword
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8
    container_name: suez-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  rabbitmq-data:
  postgres-data:
  redis-data: